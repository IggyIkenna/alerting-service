[build-system]
requires = [
    "hatchling",
"hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "alerting-service"
dynamic = ["version"]
description = "Multi-channel alerting (Slack, email, PagerDuty) for system health and trading events"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "unified-trading-library>=0.77.0,<1.0.0",
    "unified-api-contracts>=0.109.0,<1.0.0",
    "fastapi>=0.137.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "prometheus-client<1.0.0,>=0.20.0",
    "sse-starlette>=1.6.1,<2.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "anthropic<1.0.0,>=0.87.0",
    "psutil>=6.0.0,<7.0.0",
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "pip>=26.1.2",  # PYSEC-2026-196 (pip transitive via pip-audit/pip-api; fix=26.1.2)
    "bandit>=1.7.0,<2.0.0",
    "prek>=0.4.4,<1.0.0",  # floor: j178/prek#2142 stash-restore intent-to-add fix
    # Pinned to safe versions (CVE-2026-45409, CVE-2026-4539)
    "idna<4.0.0,>=3.15",
    "pygments<3.0.0,>=2.20.0",
]

[tool.uv]
# Transitive security pins (pip-audit) — keep at or above fix versions
override-dependencies = [
    # cryptography>=50.0.0 closes CVE-2026-69247 (PKCS#7 EnvelopedData decryption Bleichenbacher
    # oracle via distinguishable errors/timing, introduced in 44.0.0) found in 49.0.0 by pip-audit.
    # No BACKWARDS INCOMPATIBLE changes in the 50.0.0 changelog; alerting-service has no direct
    # `cryptography` import (transitive only).
    "cryptography>=50.0.0,<51.0.0",
]

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

# Upstream prek (PyPI) still has an unfixed corruption bug as of 0.4.11 (silently drops
# uncommitted work on a stash-restore conflict). Resolve from our patched fork's release
# wheels instead until the upstream PR merges — see
# unified-trading-pm/scripts/hooks/prek-keeper-fix/README.md. Covers darwin/linux only
# (this fleet's only real platforms); an uncovered marker falls back to vulnerable stock
# PyPI prek by uv's own resolution rules — add a windows marker+wheel here first if a
# Windows host is ever added.
[[tool.uv.sources.prek]]
url = "https://github.com/IggyIkenna/prek/releases/download/v0.4.12/prek-0.4.12-py3-none-macosx_11_0_arm64.whl"
marker = "sys_platform == 'darwin' and platform_machine == 'arm64'"

[[tool.uv.sources.prek]]
url = "https://github.com/IggyIkenna/prek/releases/download/v0.4.12/prek-0.4.12-py3-none-macosx_10_12_x86_64.whl"
marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'"

[[tool.uv.sources.prek]]
url = "https://github.com/IggyIkenna/prek/releases/download/v0.4.12/prek-0.4.12-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
marker = "sys_platform == 'linux'"

[tool.hatch.build.targets.wheel]
packages = ["alerting_service"]

# ── ruff (lint + format) ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811"]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["alerting_service"]
known-third-party = ["unified_trading_library", "unified_api_contracts"]

# ── basedpyright (typecheck) — CONSOLIDATED; delete pyrightconfig.json ──────────
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["alerting_service"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
reportMissingImports = "error"
reportMissingTypeStubs = false
reportMissingModuleSource = "none"
reportAny = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportMissingParameterType = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportAssignmentType = "error"
reportCallIssue = "error"
reportGeneralTypeIssues = "error"
reportIndexIssue = "error"
reportOptionalMemberAccess = "error"
reportAttributeAccessIssue = "error"

[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    "../unified-trading-library",
    "../unified-api-contracts",
]

# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as unit test",
    "integration: integration tests requiring real GCP credentials and API keys",
    "smoke: mark test as smoke test",
]

# ── coverage (run + report — BOTH required in every repo) ────────────────────────
[tool.coverage.run]
source = ["alerting_service"]
branch = true
# pytest-cov + xdist: workers are separate processes; without parallel-combine the terminal
# fail-under reads PARTIAL (controller-only) data and spuriously fails (2026-06-22: mtds saw
# terminal 46.4% while coverage.xml correctly combined to 83.95%). parallel-combine fixes the gate.
parallel = true
concurrency = ["thread", "multiprocessing"]
sigterm = true

[tool.coverage.report]
fail_under = 76
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

# ── bandit (security SAST — every repo) ──────────────────────────────────────────
[tool.bandit]
skips = []

# ── quality-gates ratchet ceilings ───────────────────────────────────────────────
[tool.quality-gates]
basedpyright_max_errors = 21

[tool.hatch.version]
source = "vcs"
