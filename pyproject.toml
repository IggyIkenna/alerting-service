[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "alerting-service"
version = "0.10.0"
description = "Multi-channel alerting (Slack, email, PagerDuty) for system health and trading events"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "unified-trading-library>=0.13.0,<1.0.0",
    "unified-api-contracts>=0.24.0,<1.0.0",
    "fastapi>=0.115.0,<0.137.0",
    "uvicorn>=0.27.0,<1.0.0",
    "prometheus-client<1.0.0,>=0.20.0",
    "sse-starlette>=1.6.1,<2.0.0",
    "aiohttp>=3.13.4,<3.14.0",
    "httpx>=0.28.1,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "anthropic<1.0.0,>=0.87.0",
    "psutil>=6.0.0,<7.0.0",
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "prek>=0.3.0,<1.0.0",
    # Pinned to safe versions (CVE-2026-45409, CVE-2026-4539)
    "idna>=3.15",
    "pygments>=2.20.0",
]

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true

[tool.hatch.build.targets.wheel]
packages = ["alerting_service"]

# ── ruff (lint + format) ────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".cursor", ".venv", ".venv-workspace", "build", "dist", "node_modules"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "G", "C90"]
extend-ignore = ["G003", "G004"]
ignore = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 26

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "E402"]
"tests/*" = ["F401", "F841", "F811"]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["alerting_service"]
known-third-party = ["unified_trading_library", "unified_api_contracts"]

# ── basedpyright (typecheck) — CONSOLIDATED; delete pyrightconfig.json ──────────
[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["alerting_service"]
exclude = ["tests", "**/__pycache__", ".venv*", ".venv-workspace", "build", "dist", "node_modules"]
reportMissingImports = "error"
reportMissingTypeStubs = false
reportMissingModuleSource = "none"
reportAny = "error"
reportUnknownArgumentType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportMissingParameterType = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportAssignmentType = "error"
reportCallIssue = "error"
reportGeneralTypeIssues = "error"
reportIndexIssue = "error"
reportOptionalMemberAccess = "error"
reportAttributeAccessIssue = "error"

[[tool.basedpyright.executionEnvironments]]
root = "."
pythonVersion = "3.13"
pythonPlatform = "All"
extraPaths = [
    "../unified-config-interface",
    "../unified-internal-contracts",
    "../unified-cloud-interface",
    "../unified-trading-library",
    "../unified-events-interface",
]

# ── pytest ──────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: mark test as unit test",
    "integration: integration tests requiring real GCP credentials and API keys",
    "smoke: mark test as smoke test",
]

# ── coverage (run + report — BOTH required in every repo) ────────────────────────
[tool.coverage.run]
source = ["alerting_service"]
branch = true

[tool.coverage.report]
fail_under = 76
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

# ── bandit (security SAST — every repo) ──────────────────────────────────────────
[tool.bandit]
skips = []
