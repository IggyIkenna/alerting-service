[build-system]
requires = [
    "setuptools>=68.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "alerting-service"
version = "0.1.0"
description = "Multi-channel alerting (Slack, email, PagerDuty) for system health and trading events"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "unified-events-interface>=1.0.0,<2.0.0",
    "unified-config-interface>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-xdist<4.0.0,>=3.6.0",
    "pytest-timeout<3.0.0,>=2.4.0",
    "ruff==0.15.0",
    "basedpyright<2.0.0,>=1.21.0",
    "pip-audit<3.0.0,>=2.7.0",
    "bandit<2.0.0,>=1.7.0",
    "pre-commit>=3.0,<4.0.0",
]

[tool.uv.sources]
unified-config-interface = { path = "../unified-config-interface" }
unified-events-interface = { path = "../unified-events-interface" }

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "alerting_system*",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=alerting_system --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.basedpyright]
reportAny = "error"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportUnknownMemberType = "error"
reportMissingTypeArgument = "error"
reportMissingImports = "error"
reportUnusedVariable = "warning"
reportUnusedImport = "warning"
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = [
    "alerting_system",
]
exclude = [
    "tests",
    "**/__pycache__",
    ".venv*",
    "build",
    "dist",
]
