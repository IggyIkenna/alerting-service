[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "alerting-service"
version = "0.1.0"
description = "Multi-channel alerting (Slack, email, PagerDuty) for system health and trading events"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "unified-trading-library>=0.1.0,<1.0.0",
    "unified-api-contracts>=0.1.0,<1.0.0",
    "fastapi<1.0.0,>=0.115.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "prometheus-client<1.0.0,>=0.20.0",
    "sse-starlette>=1.6.1,<2.0.0",
    "aiohttp>=3.13.2,<4.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "anthropic>=0.49.0,<1.0.0",
    "psutil>=6.0.0,<7.0.0",
    "pytest>=9.0.1,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "ruff==0.15.0",
    "basedpyright==1.38.2",
    "pip-audit>=2.7.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pre-commit>=3.0,<4.0.0",
    "pyjwt>=2.12.0,<3.0.0",
]

[tool.uv.sources.unified-trading-library]
path = "../unified-trading-library"
editable = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "G",
    "C90",
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=alerting_service --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (no real network I/O, all external calls mocked)",
    "smoke: mark test as smoke test",
    "unit: mark test as unit test",
]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]


[tool.uv.sources.unified-api-contracts]
path = "../unified-api-contracts"
editable = true





[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportAny = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"
reportUnknownParameterType = "error"
reportMissingTypeArgument = "error"
reportMissingImports = "error"
reportUnusedVariable = "warning"
reportUntypedFunctionDecorator = "none"
reportUntypedBaseClass = "none"
reportUnusedImport = "warning"
venvPath = "."
venv = ".venv"
include = [
    "alerting_service",
]
exclude = [
    "tests",
    "**/__pycache__",
    ".venv*",
    "build",
    "dist",
]
extraPaths = [
    "../unified-trading-library",
]
