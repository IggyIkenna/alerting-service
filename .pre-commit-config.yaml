default_install_hook_types:
  - pre-commit
  - commit-msg

# See https://pre-commit.com for more information
repos:
  # Conventional commit validation (feat:/fix:/chore:/docs:/refactor:/test:/ci:)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Prettier - TypeScript/JSON/Markdown formatter
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format with Prettier
        types_or: [ts, tsx, javascript, jsx, json, markdown, yaml]
        additional_dependencies:
          - prettier@3.6.2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: "^cloudbuild\\.yaml$" # cloudbuild.yaml uses embedded Python strings that fail PyYAML strict parsing
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: local
    hooks:
      - id: file-size-limit
        name: Check file size limit
        entry: bash -c 'find . -name "*.py" -size +500k -exec echo "File {} exceeds 500 lines" \; -exec false \;'
        language: system
        pass_filenames: false

      - id: no-backup-files
        name: No backup files
        entry: bash -c '! find . -name "*_backup.py" -o -name "*_original.py" -o -name "*_clean.py" | grep -q .'
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-import-patterns
        name: Check external import patterns
        entry: python3 .cursor/scripts/check-import-patterns.py
        language: python
        files: \.py$
        pass_filenames: false
        stages: [commit]
      - id: fix-import-patterns
        name: Fix external import patterns (manual)
        entry: python3 .cursor/scripts/check-import-patterns.py --fix
        language: python
        files: \.py$
        pass_filenames: false
        stages: [manual]
