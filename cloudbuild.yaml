# Cloud Build for alerting-service
#
# ARCHITECTURE: Test the artifact you deploy
#   1. Pull base image
#   2. Build Docker image
#   3. Run quality gates INSIDE the image
#   4. Push ONLY if tests pass
#
steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args:
      ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe unified-trading-system \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create unified-trading-system \
          --repository-format=docker \
          --location=asia-northeast1 \
          --description="alerting-service and related service Docker images"
        # Enable Container Analysis vulnerability scanning
        gcloud artifacts repositories update unified-trading-system \
          --location=asia-northeast1 \
          --enable-vulnerability-scanning 2>/dev/null || true
    waitFor: ["-"]

  - name: "gcr.io/cloud-builders/docker"
    id: "pull-base-image"
    args:
      [
        "pull",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-library/unified-trading-library:latest",
      ]
    waitFor: ["configure-docker"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "-f"
      - "Dockerfile"
      - "--build-arg"
      - "PROJECT_ID=$PROJECT_ID"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/alerting-service:$SHORT_SHA"
      - "-t"
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/alerting-service:latest"
      - "."
    waitFor: ["pull-base-image", "ensure-repo"]

  - name: "gcr.io/cloud-builders/docker"
    id: "quality-gates"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        docker run --rm \
          --entrypoint "" \
          -e CLOUD_BUILD=true \
          -e CLOUD_MOCK_MODE=true \
          -e GCP_PROJECT_ID=$PROJECT_ID \
          -e GCP_PROJECT_ID=$PROJECT_ID \
          asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/alerting-service:$SHORT_SHA \
          /bin/bash -c "bash scripts/quality-gates.sh --no-fix --quick"
    waitFor: ["build"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      [
        "push",
        "--all-tags",
        "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/alerting-service",
      ]
    waitFor: ["quality-gates"]

  # Step: Vulnerability scan — check for CRITICAL CVEs in pushed image
  # Container Analysis scans asynchronously after push; retry for up to 3 min
  - name: "gcr.io/cloud-builders/gcloud"
    id: "scan-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        IMAGE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/alerting-service:$SHORT_SHA"
        echo "Waiting for Container Analysis vulnerability scan on $IMAGE..."
        # Poll up to 18 times × 10s = 3 minutes for scan to complete
        for i in $(seq 1 18); do
          RESULT=$(gcloud artifacts docker images describe "$IMAGE" \
            --show-package-vulnerability --format="json" 2>/dev/null)
          if [ -n "$RESULT" ]; then
            CRITICAL=$(echo "$RESULT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('package_vulnerability_summary',{}).get('vulnerabilities',{}).get('CRITICAL',[])))" 2>/dev/null || echo "0")
            if [ "$CRITICAL" != "0" ]; then
              echo "SCAN FAILED: $CRITICAL CRITICAL CVEs found in $IMAGE"
              gcloud artifacts docker images describe "$IMAGE" \
                --show-package-vulnerability --format="table[box](package_vulnerability_summary.vulnerabilities.CRITICAL[].vulnerability,package_vulnerability_summary.vulnerabilities.CRITICAL[].fixedPackage)" 2>/dev/null || true
              exit 1
            fi
            echo "Scan complete: 0 CRITICAL CVEs — image is clean"
            exit 0
          fi
          echo "Scan not ready yet (attempt $i/18) — waiting 10s..."
          sleep 10
        done
        echo "WARNING: Vulnerability scan did not complete within 3 minutes — proceeding (non-blocking)"
        exit 0
    waitFor: ["push"]

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/alerting-service:$SHORT_SHA"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-system/alerting-service:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "600s"
