# Cloud Build Template — Unified Trading System Services
#
# CANONICAL TEMPLATE for service cloudbuild.yaml files.
# Service-specific variants must preserve all REQUIRED steps (marked below).
# DO NOT auto-generate — human review required for service-specific customization.
#
# Required step IDs (enforced by quality-gates.sh STEP 5.22 for canary services):
#   - configure-docker     (Docker auth)
#   - ensure-repo          (Artifact Registry bootstrap)
#   - pull-base-image      (UTL base image)
#   - build                (Docker image build)
#   - quality-gates        (REQUIRED: test the artifact you deploy)
#   - push                 (REQUIRED: push only if quality gates pass)
#   - scan-check           (REQUIRED: CRITICAL CVE gate)
#
# Optional steps (service-specific):
#   - extract-version      (semver tagging from pyproject.toml)
#   - notify-deployment    (dispatch to deployment-service stable_versions.yaml)
#   - publish-wheel        (Python wheel to Artifact Registry)
#
# Services deployed via central deployment-service (not inline): add "# deploy-via-dispatch"
# after the title to suppress STEP 5.17 advisory. Rollout: add-cloudbuild-deploy-via-dispatch.py --all
#
# Variable conventions:
#   _SERVICE_NAME          — substitution: e.g. my-service
#   _REGISTRY_REPO         — substitution: e.g. unified-trading-system
#   _PKG_NAME              — substitution: e.g. my_service (underscores)
#   $PROJECT_ID            — Cloud Build built-in
#   $SHORT_SHA             — Cloud Build built-in (use for image tagging)
#   $$VERSION              — double-dollar for shell variable inside args
#
# Machine type: E2_HIGHCPU_8 (standard for all service builds)
# Timeout: 1800s (services), 600s (lightweight services without wheel publish)
# Logging: CLOUD_LOGGING_ONLY
#
# Reference: unified-trading-codex/04-architecture/deployment-pipeline.md
# QG enforcement: STEP 5.22 in quality-gates.sh (canary: execution, instruments, alerting)

substitutions:
  _SERVICE_NAME: "alerting-service"
  _REGISTRY_REPO: "unified-trading-system"
  _PKG_NAME: "alerting_service"

steps:
  # ── fetch-tags: make hatch-vcs (source = "vcs") resolvable in the wheel-build step ──────────
  # Cloud Build's FETCHSOURCE is a SHALLOW, tag-less /workspace/.git → setuptools-scm cannot detect
  # the version in the later python:3.13-slim wheel step. This step authenticates with GH_PAT and
  # fetches tags + full history into the SHARED /workspace/.git so the wheel step resolves it.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "fetch-tags"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        if [ ! -d /workspace/.git ]; then
          echo "fetch-tags: /workspace/.git absent (non-trigger build) — skipping (wheel step reports any real error)"
          exit 0
        fi
        GH_PAT=$$(gcloud secrets versions access latest --secret=GH_PAT --project=$PROJECT_ID 2>/dev/null || echo "")
        REMOTE="https://github.com/IggyIkenna/$REPO_NAME.git"
        [ -n "$$GH_PAT" ] && REMOTE="https://$$GH_PAT@github.com/IggyIkenna/$REPO_NAME.git"
        # Unshallow so tagged commits are reachable for setuptools-scm (a plain tag-ref fetch on a
        # shallow clone leaves git describe unable to compute the version). Fall back to a tags-only
        # fetch when the repo is already complete (--unshallow errors on a non-shallow repo).
        git -C /workspace fetch --unshallow --tags --force "$$REMOTE" "+refs/tags/*:refs/tags/*" 2>/dev/null \
          || git -C /workspace fetch --tags --force "$$REMOTE" "+refs/tags/*:refs/tags/*"
        echo "fetch-tags: $$(git -C /workspace tag --list 'v*' | wc -l | tr -d ' ') v* tags present"
    waitFor: ["-"]

  # ── Auth pre-check: fail fast if SA lacks AR access (before expensive build) ─
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:alpine"
    id: "auth-precheck"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        echo "=== Auth pre-check ==="
        TOKEN=$$(gcloud auth print-access-token) || { echo "FAIL: No GCP token"; exit 1; }
        echo "GCP token OK"
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $$TOKEN" "https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/simple/" || echo "000")
        if [ "$$STATUS" != "200" ] && [ "$$STATUS" != "404" ]; then
          echo "FAIL: Python AR HTTP $$STATUS"; exit 1
        fi
        echo "Python AR OK"
        gcloud artifacts repositories describe unified-trading-library --location=asia-northeast1 --quiet || { echo "FAIL: Docker AR"; exit 1; }
        echo "Docker AR OK"
        echo "=== Auth pre-check passed ==="
    waitFor: ["-"]

  # ── OPTIONAL: Extract the human-readable version for semver tagging ──────

  # Resolves the version that tags the image (in addition to $SHORT_SHA). Phase-2/D13: the version
  # SSOT is the git TAG (version_source=git-tag / dynamic-pyproject repos carry NO committed
  # 'version =' line, so a pyproject grep returns empty and the image would be mis-tagged). Source
  # order: git tag (authoritative) > pyproject line (static repos, mid-migration) > short SHA. For a
  # STATIC repo the nearest v-tag equals its pyproject version by coherence, so this is
  # backward-compatible — it only CHANGES behavior for git-tag repos (which it FIXES). Mirrors the
  # deployment-service DS-1 git-describe fix.
  - name: "gcr.io/cloud-builders/git"
    id: "extract-version"
    entrypoint: "bash"
    secretEnv: ["GH_PAT"]
    args:
      - "-c"
      - |
        # Cloud Build's FETCHSOURCE is shallow + tag-less, so `git describe` fails for hatch-vcs
        # (source = "vcs"). Authenticate with GH_PAT and unshallow + fetch tags so the real v-tag
        # (reachable from LDR HEAD) resolves. Fall back to a tags-only fetch on an already-complete
        # repo (--unshallow errors there), then plain unauth fetch.
        git fetch "https://$$GH_PAT@github.com/IggyIkenna/$REPO_NAME.git" --unshallow --tags --force 2>/dev/null \
          || git fetch "https://$$GH_PAT@github.com/IggyIkenna/$REPO_NAME.git" --tags --force 2>/dev/null \
          || git fetch --tags --force --quiet 2>/dev/null || true
        VERSION=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')
        if [ -z "$$VERSION" ]; then
          VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname 2>/dev/null | head -1 | sed 's/^v//')
        fi
        if [ -z "$$VERSION" ]; then
          VERSION=$(grep '^version' pyproject.toml 2>/dev/null | head -1 | sed 's/version = "//;s/"//')
        fi
        if [ -z "$$VERSION" ]; then
          # PEP440- AND docker-tag-safe fallback (VERSION is also a docker -t tag): never a bare SHA,
          # never a +local form.
          VERSION="0.0.0.dev0"
        fi
        echo "$$VERSION" > /workspace/VERSION
        echo "Building version $$VERSION (source: git-tag > pyproject > 0.0.0.dev0)"
    waitFor: ["-"]

  # ── STEP 1: Configure Docker authentication ───────────────────────────────
  - name: "gcr.io/cloud-builders/gcloud"
    id: "configure-docker"
    args: ["auth", "configure-docker", "asia-northeast1-docker.pkg.dev", "--quiet"]
    waitFor: ["-"]

  # ── STEP 2: Ensure Artifact Registry repository exists ───────────────────
  - name: "gcr.io/cloud-builders/gcloud"
    id: "ensure-repo"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud artifacts repositories describe ${_REGISTRY_REPO} \
          --location=asia-northeast1 &>/dev/null || \
        gcloud artifacts repositories create ${_REGISTRY_REPO} \
          --repository-format=docker \
          --location=asia-northeast1 \
          --description="${_SERVICE_NAME} Docker images"
        gcloud artifacts repositories update ${_REGISTRY_REPO} \
          --location=asia-northeast1 \
          --enable-vulnerability-scanning 2>/dev/null || true
    waitFor: ["-"]

  # ── STEP 3: Pull UTL base image (required for authenticated access) ───────
  # DIGEST-AWARE (FROM-digest ratchet, 2026-06-10): when the Dockerfile carries a pinned
  # `ARG BASE_IMAGE_DIGEST=sha256:<64-hex>` default, pre-pull THAT digest (authenticated CLI
  # pull → docker caches the manifest under the digest ref → the in-build FROM @${...} hits
  # cache). Without this, a pin one generation behind :latest forces a daemon-side registry
  # pull which is UNAUTHENTICATED → "denied" (live incident: mtds builds a18c2981/bb37c7b9,
  # 2026-06-10 — the very first digest-pinned builds). :latest is ALSO pulled so unpinned /
  # legacy Dockerfiles keep working and the freshness comparison stays observable in logs.
  - name: "gcr.io/cloud-builders/docker"
    id: "pull-base-image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        # NOTE: double-dollar escapes shell vars from Cloud Build's OWN substitution pass
        # (PROJECT_ID is deliberately single-dollar — it IS a Cloud Build substitution).
        # The substitution validator scans this WHOLE block INCLUDING these comment lines,
        # so even prose may not contain dollar-PIN/dollar-BASE (live incident 2026-06-10:
        # the config was rejected twice — first for unescaped shell vars, then for the
        # explanatory comment that mentioned them with dollars).
        BASE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/unified-trading-library/unified-trading-library"
        PIN=$$(sed -n 's/^ARG BASE_IMAGE_DIGEST=\(sha256:[0-9a-f]\{64\}\).*/\1/p' Dockerfile | head -1 || true)
        if [ -n "$$PIN" ]; then
          echo "pinned base digest: $$PIN — pre-pulling the PINNED manifest"
          docker pull "$${BASE}@$${PIN}"
        fi
        docker pull "$${BASE}:latest" || true
        # layer-cache seed: pull our own previous :latest so --cache-from reuses layers
        docker pull "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest" || true
    waitFor: ["configure-docker"]

  # ── STEP 4: Build Docker image ────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$(cat /workspace/VERSION 2>/dev/null || echo "0.0.0.dev0")
        DOCKER_BUILDKIT=1 docker build -f Dockerfile \
          --build-arg PROJECT_ID=$PROJECT_ID \
          --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=$$VERSION \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$$VERSION \
          -t asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest \
          .
    waitFor: ["pull-base-image", "ensure-repo", "extract-version"]

  # ── STEP 5: REQUIRED — Run quality gates INSIDE the image ─────────────────
  # CRITICAL: Use --entrypoint "" to clear the image's default ENTRYPOINT.
  # Then run /bin/bash -c "..." explicitly. --entrypoint bash does NOT work reliably.
  # Service-specific env vars: add -e KEY=VALUE lines for required config.
  - name: "gcr.io/cloud-builders/docker"
    id: "quality-gates"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        VERSION=$(cat /workspace/VERSION 2>/dev/null || echo "$SHORT_SHA")
        echo "Running quality gates inside ${_SERVICE_NAME} image..."
        docker run --rm \
          --entrypoint "" \
          -e CLOUD_BUILD=true \
          -e CLOUD_MOCK_MODE=true \
          -e GCP_PROJECT_ID=$PROJECT_ID \
          asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$$VERSION \
          /bin/bash -c "scripts/quality-gates.sh --no-fix --quick"
    waitFor: ["build"]

  # ── STEP 6: REQUIRED — Push image ONLY if quality gates passed ────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args: ["push", "--all-tags", "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}"]
    waitFor: ["quality-gates"]

  # ── STEP 7: REQUIRED — Vulnerability scan (CRITICAL CVE gate) ────────────
  # Container Analysis scans asynchronously after push; poll up to 3 minutes.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "scan-check"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$(cat /workspace/VERSION 2>/dev/null || echo "$SHORT_SHA")
        IMAGE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$$VERSION"
        echo "Waiting for Container Analysis vulnerability scan on $$IMAGE..."
        for i in $(seq 1 18); do
          RESULT=$(gcloud artifacts docker images describe "$$IMAGE" \
            --show-package-vulnerability --format="json" 2>/dev/null)
          if [ -n "$$RESULT" ]; then
            CRITICAL=$(echo "$$RESULT" | python3 -c "import json,sys;d=json.load(sys.stdin);summary=d.get('package_vulnerability_summary',{});vulns=summary.get('vulnerabilities',{});crits=vulns.get('CRITICAL',[]);print(len(crits))" 2>/dev/null || echo "0")
            if [ "$$CRITICAL" != "0" ]; then
              echo "SCAN FAILED: $$CRITICAL CRITICAL CVEs found in $$IMAGE"
              gcloud artifacts docker images describe "$$IMAGE" \
                --show-package-vulnerability \
                --format="table[box](package_vulnerability_summary.vulnerabilities.CRITICAL[].vulnerability,package_vulnerability_summary.vulnerabilities.CRITICAL[].fixedPackage)" \
                2>/dev/null || true
              exit 1
            fi
            echo "Scan complete: 0 CRITICAL CVEs — image is clean"
            exit 0
          fi
          echo "Scan not ready yet (attempt $$i/18) — waiting 10s..."
          sleep 10
        done
        echo "WARNING: Vulnerability scan did not complete within 3 minutes — proceeding (non-blocking)"
        exit 0
    waitFor: ["push"]

  # ── OPTIONAL: Notify deployment-service to update stable_versions.yaml ────
  # Requires GH_PAT secret in Secret Manager. allowFailure: true — advisory only.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "notify-deployment"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        VERSION=$(cat /workspace/VERSION 2>/dev/null || echo "$SHORT_SHA")
        IMAGE="asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$$VERSION"
        GH_PAT=$(gcloud secrets versions access latest --secret=GH_PAT --project=$PROJECT_ID 2>/dev/null || echo "")
        if [ -n "$$GH_PAT" ]; then
          curl -sS -X POST \
            -H "Authorization: token $$GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/IggyIkenna/deployment-service/dispatches \
            -d "{\"event_type\":\"service-deployed\",\"client_payload\":{\"service_name\":\"${_SERVICE_NAME}\",\"version\":\"$$VERSION\",\"image\":\"$$IMAGE\"}}"
          echo "Notified deployment-service: ${_SERVICE_NAME} $$VERSION"
        else
          echo "GH_PAT not configured — skipping dispatch"
        fi
    waitFor: ["push"]
    allowFailure: true

  # ── OPTIONAL: Publish Python wheel to Artifact Registry ───────────────────
  # For services that are also imported as libraries by other services.
  # Remove this step if the service has no cross-service Python imports.
  - name: "python:3.13-slim"
    id: "publish-wheel"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -e
        pip install uv
        python -m pip install --no-cache-dir build twine keyrings.google-artifactregistry-auth
        mkdir -p /root/.config/pip
        echo "[global]
        extra-index-url = https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/simple/" \
          > /root/.config/pip/pip.conf
        # fetch-tags-fix: git for setuptools-scm
        command -v git >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y --no-install-recommends git; }
        git config --global --add safe.directory /workspace || true
        # hatch-vcs (source = "vcs"): pin the version that extract-version resolved so the wheel build
        # never depends on git describe inside this slim image.
        export SETUPTOOLS_SCM_PRETEND_VERSION=$(cat /workspace/VERSION 2>/dev/null || echo "0.0.0.dev0")
        echo "publish-wheel: SETUPTOOLS_SCM_PRETEND_VERSION=$$SETUPTOOLS_SCM_PRETEND_VERSION"
        python -m build --wheel --outdir dist/
        python -m twine upload \
          --repository-url https://asia-northeast1-python.pkg.dev/$PROJECT_ID/unified-libraries/ \
          --non-interactive dist/*.whl || true
    waitFor: ["quality-gates", "fetch-tags", "extract-version"]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GH_PAT/versions/latest
      env: GH_PAT

images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:$SHORT_SHA"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/${_REGISTRY_REPO}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"
