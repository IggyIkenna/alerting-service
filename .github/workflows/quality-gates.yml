name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            # Clone to ../ to match pyproject.toml path = "../repo"
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/api-contracts.git ../api-contracts
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-cloud-services.git ../unified-cloud-services
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-config-interface.git ../unified-config-interface
            git clone https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-events-interface.git ../unified-events-interface
            echo "✅ Cloned unified-cloud-services, unified-config-interface, unified-events-interface"
          else
            echo "❌ GH_PAT not set - required for alerting-system (depends on UCS, UEI, UCI)" && exit 1
          fi

      - name: Install uv
        run: pip install uv

      - name: Install ripgrep (required for codex checks)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          uv pip install --system ruff==0.15.0 basedpyright
          uv pip install --system -e ../api-contracts 2>/dev/null || true
          uv pip install --system -e ../unified-cloud-services
          uv pip install --system -e ../unified-config-interface
          uv pip install --system -e ../unified-events-interface
          uv pip install --system -e ".[dev]"

      - name: Run quality gates
        run: bash scripts/quality-gates.sh --no-fix
