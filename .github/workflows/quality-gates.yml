name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python CI tools
        uses: IggyIkenna/unified-trading-pm/.github/actions/setup-python-tools@main
        with:
          python-version: "3.13.9"

      - name: Checkout dependencies
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEP_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="${DEP_BRANCH:-main}"
          if [ -n "$GH_PAT" ]; then
            # Clone to ../ to match pyproject.toml path = "../repo"
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/api-contracts.git" ../api-contracts 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/api-contracts.git" ../api-contracts 2>/dev/null) || true
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-library.git" ../unified-trading-library 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-library.git" ../unified-trading-library 2>/dev/null) || true
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-config-interface.git" ../unified-config-interface 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-config-interface.git" ../unified-config-interface 2>/dev/null) || true
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-events-interface.git" ../unified-events-interface 2>/dev/null || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-events-interface.git" ../unified-events-interface 2>/dev/null) || true
            (git clone -b "$BRANCH" "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null \
              || git clone -b main "https://x-access-token:${GH_PAT}@github.com/IggyIkenna/unified-trading-pm.git" ../unified-trading-pm 2>/dev/null) || true
            echo "✅ Cloned unified-trading-library, unified-config-interface, unified-events-interface"
          else
            echo "❌ GH_PAT not set - required for alerting-system (depends on UCS, UEI, UCI)" && exit 1
          fi

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python ruff==0.15.0 basedpyright
          uv pip install --python .venv/bin/python -e ../api-contracts 2>/dev/null || true
          uv pip install --python .venv/bin/python -e ../unified-trading-library
          uv pip install --python .venv/bin/python -e ../unified-config-interface
          uv pip install --python .venv/bin/python -e ../unified-events-interface
          uv pip install --python .venv/bin/python -e ".[dev]" || uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python pytest pytest-cov pytest-asyncio pytest-timeout pytest-xdist bandit pip-audit

      - name: Run quality gates
        env:
          CLOUD_PROVIDER: "local"
          CLOUD_MOCK_MODE: "true"
          GCP_PROJECT_ID: "test-project"
        run: |
          export PATH="$(pwd)/.venv/bin:$PATH"
          bash scripts/quality-gates.sh --no-fix
      - name: Record CI status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          [ -z "${GH_PAT}" ] && echo "GH_PAT not set — skipping ci-status-update" && exit 0
          STATUS="${{ job.status == 'success' && 'PASSING' || 'FAILING' }}"
          curl -s -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/unified-trading-pm/dispatches" \
            -d "{\"event_type\": \"ci-status-update\", \"client_payload\": {\"repo\": \"${{ github.event.repository.name }}\", \"status\": \"${STATUS}\", \"sha\": \"${{ github.sha }}\"}}"
