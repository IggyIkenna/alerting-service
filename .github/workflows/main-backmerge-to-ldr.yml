name: main-backmerge-to-ldr

# Thin caller stub (fleet_workflow_template_dedup_to_unified_trading_ci_2026_08_06.md
# todo 4) -- the actual logic now lives in unified-trading-ci as a workflow_call
# reusable workflow. Local trigger config is unavoidable (GitHub Actions requires a
# physical file per repo to declare it), but no job logic lives here anymore.
#
# Do NOT hand-edit the logic here — edit
# unified-trading-ci/.github/workflows/main-backmerge-to-ldr.yml and every caller picks it up
# automatically on the next run (pinned @main).

on:
  push:
    branches:
      - main
  # Drift-tick schedule REMOVED 2026-06-27: the hourly safety-net for [skip ci] drift is now
  # handled by branch-health.yml (hourly, 0 * * * *) which dispatches this workflow fleet-wide
  # for unified-trading-pm + every promotion_model: ldr_main repo (2026-08-19) -- so a transient
  # GHA failure (e.g. a codeload 429) that strands one repo's backmerge is re-driven on the
  # next hour. The push trigger still handles the immediate push case; LDR drift is acceptable
  # within ~60 min (the hourly tick window).
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: backmerge-to-ldr
  cancel-in-progress: false

jobs:
  backmerge:
    uses: IggyIkenna/unified-trading-ci/.github/workflows/main-backmerge-to-ldr.yml@main
    secrets: inherit
