# Workspace-level gitleaks configuration.
# SSOT: unified-trading-pm/.gitleaks.toml — propagated to all repos by rollout-pre-commit-configs.sh
# Run: gitleaks detect --config .gitleaks.toml --source .
# Run (git history): gitleaks git --config .gitleaks.toml --source .

[extend]
useDefault = true

# ============================================================
# ALLOWLISTS — workspace-wide false positives
# ============================================================
#
# GOTCHA (found 2026-07-24, cost a full failed-first-attempt cycle): a `regexes` entry must match
# the SUBSTRING gitleaks actually captured as the "Secret" for that rule -- NOT the full source
# line, and not whatever context you'd naturally include for readability. E.g. a Docker image tag
# `client-reporting-api:golive-9968cb1` triggers the default `generic-api-key` rule, but that rule
# only captures `golive-9968cb1` as the Secret -- an allowlist regex requiring the
# `client-reporting-api:` prefix (`[a-z][a-z0-9-]*:golive-[0-9a-f]{7}\b`) does NOT match and the
# false positive keeps failing. Verify a NEW allowlist entry with the EXACT command the hook runs,
# AFTER actually staging the offending file: `gitleaks protect --staged --config .gitleaks.toml`
# (an empty stage trivially reports "no leaks found" and proves nothing).

[[allowlists]]
description = "Ethereum contract addresses and event topic hashes in DeFi source code"
regexes = [
  # Ethereum 20-byte address (40 hex chars) in Python string
  '''0x[0-9a-fA-F]{40}''',
  # Ethereum 32-byte topic hash / tx hash (64 hex chars)
  '''0x[0-9a-fA-F]{64}''',
]
paths = [
  # DeFi source files where contract addresses are expected
  '''.*kelpdao.*\.py''',
  '''.*rocket_pool.*\.py''',
  '''.*renzo.*\.py''',
  '''.*lido.*\.py''',
  '''.*aave.*\.py''',
  '''.*uniswap.*\.py''',
  '''.*curve.*\.py''',
  '''.*balancer.*\.py''',
  '''.*capture_golden_swaps.*\.py''',
  '''.*defi.*\.py''',
  '''.*onchain.*\.py''',
  '''.*connector.*\.py''',
  '''.*execution-service/.*''',
]

[[allowlists]]
description = "ClickUp API docs and workflow guides — tokens shown as examples in documentation"
paths = [
  '''.*CLICKUP_GUIDE\.md''',
]

[[allowlists]]
description = ".env.example placeholder values — template files with documented placeholders"
paths = [
  '''.*\.env\.example''',
  '''.*\.env\.template''',
]
regexes = [
  # Lines that are clearly placeholders/instructions, not real secrets
  '''#.*token.*''',
  '''#.*key.*''',
  '''#.*secret.*''',
  '''#.*credential.*''',
  '''your.*(key|token|secret).*here''',
  '''<YOUR.*>''',
  '''PLACEHOLDER''',
]

[[allowlists]]
description = "Firebase Web API key — Google/Firebase's own security model treats this value as public-safe (it identifies a project to Firebase's client SDK; it is not a bearer credential and carries no scoped permissions — see Firebase docs). The same key is already committed in unified-trading-system-ui/.env.production without incident (predates gitleaks adoption there). Allowlisted by EXACT value, not an AIza* pattern, so a real scoped GCP API key (Maps, other paid APIs) with actual abuse potential still trips gcp-api-key normally. Added 2026-08-12 when deployment-api/Dockerfile started baking this same key in for deployment-ui's Firebase Google sign-in (deployment_api_unauthenticated_prod_p0_2026_08_10.md follow-up)."
regexes = [
  '''AIzaSyAd6_p1UIGPY2Va5yGzLOR4DyxyHJ8QCzo''',
]

[[allowlists]]
description = "Test fixtures and VCR cassettes — synthetic/mocked credential-shaped values"
paths = [
  '''.*tests/.*fixtures/.*''',
  '''.*tests/.*cassettes/.*''',
  '''.*tests/.*vcr/.*''',
  '''.*conftest\.py''',
  '''.*_test\.py''',
  '''.*test_.*\.py''',
]

[[allowlists]]
description = "Dependency lock files and package manifests — version hashes are not secrets"
paths = [
  '''uv\.lock''',
  '''poetry\.lock''',
  '''package-lock\.json''',
  '''yarn\.lock''',
]

[[allowlists]]
description = "credentials-registry.yaml Secret Manager pointer names, not secret values — the file maps client_id to the NAME of a secret (e.g. exec-pr-okx-api-secret), fetched separately via get_secret_client(); the pointer name is never the credential itself"
paths = [
  '''.*credentials-registry\.yaml''',
]
regexes = [
  '''exec-[a-z0-9-]+-(api-key|api-secret|passphrase)''',
]

[[allowlists]]
description = "Internal blocker-reference IDs (BLK-<8-hex>) quoted verbatim in plan/issue-doc history — an internal tracking token, not a credential; confirmed already present in a previously-committed archived doc (plans/archive/issues/defi_catalogue_available_to_false_delisting_2026_07_20.md) without incident"
regexes = [
  '''BLK-[0-9a-fA-F]{8}\b''',
]

[[allowlists]]
description = "Cloud Build image tags of the shape <service>:golive-<7-hex-commit> quoted verbatim in plan/issue-doc deploy history — a Docker image tag derived from a git commit SHA, not a credential; confirmed already present in previously-committed plan history (client-reporting-api go-live Progress Log, commit 06818cd42) without incident"
regexes = [
  '''[a-z][a-z0-9-]*:golive-[0-9a-f]{7}\b''',
  '''golive-[0-9a-f]{7}\b''',
]

[[allowlists]]
description = "MORPHO/FLUID A_TOKEN/DEBT_TOKEN pair_key symbol segments (collateral-loan-marketkeyhex, e.g. AUSDC-EURC-0x305dd1 / ACBBTC-USDC-0x125081) quoted verbatim in plan/issue-doc instrument_id evidence — a canonical DeFi lending instrument_id fragment, not a credential; confirmed via `gitleaks protect --staged` on canonical_id_builder_retrofit_checklist_2026_07_08.md, 2026-08-01"
regexes = [
  '''\b(A|DEBT)[A-Za-z0-9]+-[A-Za-z0-9]+-0x[0-9a-fA-F]{6,8}\b''',
]

[[allowlists]]
description = "GCP project-specific patterns already revoked and in history-rewrite scope"
# These are documented in plans/active/issues/gcp_sa_private_key_in_git_history_*
# Remove this allowlist after history rewrite (git filter-repo) completes.
regexes = [
  # The specific key file name committed across 4 repos — operators must run history rewrite
  '''central-element-323112-e35fb0ddafe2''',
]

# ============================================================
# RULES — workspace-specific additional rules
# ============================================================

[[rules]]
id = "gcp-sa-json-committed"
description = "GCP service account JSON file committed to repo"
regex = '''"type"\s*:\s*"service_account"'''
tags = ["key", "gcp", "p0"]
severity = "CRITICAL"

[[rules]]
id = "infura-api-key"
description = "Infura API key (removed provider — should not appear)"
regex = '''infura\.io/v3/[0-9a-f]{32}'''
tags = ["key", "infura"]
severity = "HIGH"
